<mat-card>
  <mat-card-title> GAD-7 </mat-card-title>
  <mat-divider></mat-divider>

  <mat-card-content>
    <section
      *ngFor="let question of questions; let questionIndex = index"
      class="question-unit"
      [attr.data-question]="questionIndex + 1"
    >
      <p class="question">
        <span class="question-number">{{ questionIndex + 1 }}.</span>
        {{ question.prompt }}
      </p>

      <mat-radio-group class="options" aria-label="Answer choices">
        <mat-radio-button
          *ngFor="let option of question.options"
          class="answer-choice"
          [attr.data-choice]="option.value"
          [attr.data-value]="option.value"
          [value]="option.value"
        >
          {{ option.label }}
        </mat-radio-button>
      </mat-radio-group>
    </section>
  </mat-card-content>
</mat-card>
